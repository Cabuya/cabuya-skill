name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# A new push supersedes the run it interrupted: CI minutes are finite and the
# most recent commit is the one whose status matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. A job that needs more says so, in that job.
permissions:
  contents: read

jobs:
  frontmatter:
    name: SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python3 scripts/validate-frontmatter.py

  integrity:
    name: Vendored specification intact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The check that stops a hand-edited normative document reaching an
      # adopter's agent. Runs from the first commit, before anything is
      # vendored, so it is already wired the day the specification lands.
      - run: bash scripts/verify-integrity.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint every shell script that exists
        run: |
          # Globbed rather than listed: the pack is built over several tasks,
          # and a hard-coded path to a file that does not exist yet is a red
          # build that says nothing about the code.
          files=""
          for candidate in setup.sh scripts/*.sh shared/*.sh bin/*.sh tests/acceptance/*.sh; do
            [ -f "$candidate" ] && files="$files $candidate"
          done
          if [ -z "$files" ]; then
            echo "No shell scripts yet."
            exit 0
          fi
          echo "Linting:$files"
          # -f gcc because shellcheck's default output cannot encode an em dash
          # on a runner whose stdout is not UTF-8, and failing on a locale
          # difference teaches people that the lint is noise.
          # shellcheck disable=SC2086
          shellcheck -f gcc $files

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run the suite
        run: |
          if ! ls tests/*.bats >/dev/null 2>&1; then
            echo "No bats tests yet."
            exit 0
          fi
          bats tests/

  shell-compat:
    name: bash 3.2 compatibility (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # macOS ships bash 3.2, and half the machines this pack runs on are
      # laptops. A script needing bash 4 fails there and nowhere else, which
      # is the worst place for it to fail.
      - name: Confirm the shell being tested
        run: /bin/bash --version
      - name: Every script parses under bash 3.2
        run: |
          for candidate in setup.sh scripts/*.sh shared/*.sh bin/*.sh tests/acceptance/*.sh; do
            [ -f "$candidate" ] || continue
            /bin/bash -n "$candidate" || exit 1
            echo "ok: $candidate"
          done
      - name: The integrity check runs under bash 3.2
        run: /bin/bash scripts/verify-integrity.sh

  acceptance:
    name: Acceptance test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # What CI can check without an agent: that the grader still works, and
      # that a passing run is on record for the version being built.
      #
      # What it cannot: drive a real agent. That needs a harness and an API
      # key, which a fork does not have — so this job never reports the test
      # green when it did not run. The scoring is verified here; the running
      # is a human gate, documented in docs/ACCEPTANCE_TEST.md.
      - name: The grader can still fail
        run: |
          # Five committed transcripts that MUST fail. A grader that cannot
          # fail would pass every release, which is worse than having none.
          failed=0
          for fixture in tests/acceptance/fixtures/flawed-*.md; do
            if python3 tests/acceptance/grade.py "$fixture" >/dev/null 2>&1; then
              echo "✗ $(basename "$fixture") scored a PASS and must not"
              failed=$((failed + 1))
            else
              echo "✓ $(basename "$fixture") correctly fails"
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: The grader still passes a good transcript
        run: python3 tests/acceptance/grade.py tests/acceptance/fixtures/perfect-transcript.md

      - name: A passing run is recorded for this version
        run: bash tests/acceptance/run-acceptance.sh --check

      - name: State plainly that no agent ran here
        run: |
          echo "::notice title=Acceptance test::Grader verified and a recorded run checked. No agent was driven in this job; see docs/ACCEPTANCE_TEST.md. A release needs two recorded runs on two different harnesses."

  markdown-links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check.json'
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by trailer
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by:'; then
              echo "✗ $(git log -1 --format='%h %s' "$sha")"
              missing=$((missing + 1))
            fi
          done <<< "$(git rev-list "$base".."$head")"

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) without a sign-off."
            echo "Fix the last one with: git commit --amend -s"
            echo "Or a range with:       git rebase --signoff <base>"
            exit 1
          fi
          echo "✅ every commit signed off"
